# JOB.YAML
# Purpose: runs one evaluation as a Kubernetes Job (runs to completion, then stops).
# Runs the free mock evaluation; no API key in the cluster.
# Next step (roadmap): live runs with the key as a Kubernetes Secret; scheduled runs as a CronJob.
# Authorship: generated by Claude Opus 5.5 (Anthropic); reviewed by Connor.
apiVersion: batch/v1
kind: Job
metadata:
  name: llm-eval-mock
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: harness
          image: llm-eval-harness:0.1
          imagePullPolicy: IfNotPresent
          args: ["run", "--provider", "mock"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
