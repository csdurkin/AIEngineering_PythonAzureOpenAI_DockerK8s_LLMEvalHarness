# CI.YML
# Purpose: on every push, prove the harness installs, runs end to end (free mock evaluation) and builds as a container.
# No secrets: live Azure runs stay local. Unit tests to be added once rewritten for the Strunk domain.
# Authorship: generated by Claude Opus 5.5 (Anthropic); reviewed by Connor.
name: CI
on: [push, pull_request]
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install harness
        run: pip install ".[azure]"
      - name: Run mock evaluation
        run: llm-eval run --provider mock
      - name: Build container image
        run: docker build -t llm-eval-harness:ci .
